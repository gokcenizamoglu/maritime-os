name: maritimeos

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maritimeos}
      POSTGRES_USER: ${POSTGRES_USER:-maritimeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maritimeos-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - maritimeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  maritimeos_postgres_data:
