name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maritimeos
          POSTGRES_USER: maritimeos
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maritimeos -d maritimeos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: maritimeos
      POSTGRES_USER: maritimeos
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/test.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Validate production security configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: A9!ci-check-value-only_B8@with-enough-variety_C7#not-a-real-secret
          DJANGO_ALLOWED_HOSTS: app.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.test
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
          POSTGRES_HOST: database.example.test
          POSTGRES_SSLMODE: verify-full
        run: python manage.py check --deploy

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to clean PostgreSQL database
        run: python manage.py migrate --noinput

      - name: Verify migrations are current
        run: python manage.py migrate --check

      - name: Run full backend test suite on PostgreSQL
        run: python manage.py test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
